<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Budget Cycle</title>
</head>
<body>
    <h1>Create Budget Cycle</h1>
    <form method="post">
        {% csrf_token %}
        <label>Total Allowance</label>
        <input type="number" name="total_allowance" step="0.01" required>
        <br><br>
        <label>Start Date</label>
        <input type="date" name="start_date" required>
        <br><br>
        <label>End Date</label>
        <input type="date" name="end_date" required>
        <br><br>
        <button type="submit">Create</button>
    </form>
</body>
</html>
